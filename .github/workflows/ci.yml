name: source-checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gateway-local-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify local browser dependency
        run: google-chrome --version
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Local HTTP end-to-end tests
        run: bash e2e/run_e2e.sh
      - name: Local JavaScript smoke
        run: bash e2e/js_smoke.sh
      - name: Build local demo image (no registry push)
        run: docker build --tag llmgate:ci .
      - name: Verify installed image over loopback HTTP
        run: python e2e/docker_smoke.py llmgate:ci
