[project]
name = "llmgate"
version = "0.2.0"
description = "An OpenAI-compatible LLM gateway: routing, failover, streaming, per-key rate limits and usage metering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "httpx", "PyJWT>=2.3", "cryptography>=42"]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "lupa==2.8"]
[project.scripts]
llmgate = "llmgate.cli:main"

[tool.setuptools]
packages = ["llmgate", "actas"]
